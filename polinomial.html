                answer: 2, // C (29)
                hint: "<b>Rumus/Konsep:</b><br>Bentuk fungsi bantuan \\(Q(x) = P(x) - x\\). Akar-akar dari \\(Q(x) = 0\\) adalah 1, 2, 3, dan 4.",
                key: "<b>Kunci & Pembahasan:</b><br>\\(Q(x) = P(x) - x\\) berderajat 4 dengan koefisien utama 1.<br>\\(Q(x) = (x-1)(x-2)(x-3)(x-4)\\).<br>Maka \\(P(x) = (x-1)(x-2)(x-3)(x-4) + x\\).<br>Substitusi \\(x = 5\\):<br>\\(P(5) = (4)(3)(2)(1) + 5 = 24 + 5 = 29\\).<br><b>Jawaban: C (29)</b>"
            },
            {
                sub: 4, id: 20, level: "HOTS",
                question: "Sisa pembagian polinomial \\(x^{100}-2x^{99}+4\\) oleh \\(x^{2}-3x+2\\) adalah...",
                options: ["\\(x+2\\)", "\\(2x+1\\)", "3", "4", "0"],
                answer: 3, // D (4)
                hint: "<b>Rumus/Konsep:</b><br>Faktorkan pembagi: \\(x^2-3x+2 = (x-1)(x-2)\\).<br>Misalkan Sisa \\(S(x) = ax + b\\). Cari nilai \\(f(1)\\) dan \\(f(2)\\).",
                key: "<b>Kunci & Pembahasan:</b><br>\\(f(1) = 1^{100} - 2(1)^{99} + 4 = 1 - 2 + 4 = 3 \\Rightarrow a(1)+b = 3\\)<br>\\(f(2) = 2^{100} - 2(2^{99}) + 4 = 2^{100} - 2^{100} + 4 = 4 \\Rightarrow a(2)+b = 4\\)<br>Kurangkan: \\(a = 1\\).<br>Substitusi: \\(1 + b = 3 \\Rightarrow b = 2\\).<br>Maka Sisa = \\(x + 2\\)? Sisa $a(2)+b = 4 \rightarrow 2(1)+2 = 4$. Opsi A adalah $x+2$.<br><b>Jawaban: A (x+2)</b>"
            }
        ];

        let userAnswers = {};
        let currentTab = 1;

        // Render questions based on current active tab
        function renderQuestions(subNumber) {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            const filteredQuestions = questionsData.filter(q => q.sub === subNumber);

            filteredQuestions.forEach((q) => {
                const isAnswered = userAnswers[q.id] !== undefined;
                const selectedOption = userAnswers[q.id];

                let levelBadgeColor = "bg-blue-500/20 text-blue-300 border-blue-500/30";
                if(q.level === "MOTS") levelBadgeColor = "bg-amber-500/20 text-amber-300 border-amber-500/30";
                if(q.level === "HOTS") levelBadgeColor = "bg-rose-500/20 text-rose-300 border-rose-500/30";

                const card = document.createElement('div');
                card.className = `bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-md fade-in hover:border-slate-600 transition duration-300`;
                card.id = `q-card-${q.id}`;

                let optionsHTML = '';
                const labels = ['A', 'B', 'C', 'D', 'E'];

                q.options.forEach((opt, optIndex) => {
                    let optionStyle = "border-slate-700 bg-slate-800/60 hover:bg-slate-700";
                    let checkIcon = "";

                    if (isAnswered) {
                        if (optIndex === q.answer) {
                            optionStyle = "border-emerald-500 bg-emerald-950/40 text-emerald-200 font-semibold";
                            checkIcon = '<i class="fa-solid fa-circle-check text-emerald-400 ml-auto"></i>';
                        } else if (optIndex === selectedOption) {
                            optionStyle = "border-rose-500 bg-rose-950/40 text-rose-200";
                            checkIcon = '<i class="fa-solid fa-circle-xmark text-rose-400 ml-auto"></i>';
                        }
                    }

                    optionsHTML += `
                        <button onclick="selectOption(${q.id}, ${optIndex})" 
                                ${isAnswered ? 'disabled' : ''} 
                                class="w-full text-left p-3.5 rounded-xl border flex items-center gap-3 transition-all duration-200 ${optionStyle}">
                            <span class="w-7 h-7 rounded-lg bg-slate-700 flex items-center justify-center font-bold text-xs text-slate-300">${labels[optIndex]}</span>
                            <span class="flex-1">${opt}</span>
                            ${checkIcon}
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-bold px-3 py-1 rounded-full border ${levelBadgeColor}">
                            Soal ${q.id} • ${q.level}
                        </span>
                        <button onclick="toggleElement('hint-${q.id}')" class="text-xs text-amber-400 hover:text-amber-300 flex items-center gap-1 font-medium bg-amber-400/10 px-3 py-1 rounded-lg border border-amber-400/20">
                            <i class="fa-regular fa-lightbulb"></i> Hint/Rumus
                        </button>
                    </div>

                    <div class="text-lg font-medium mb-4 text-slate-100 leading-relaxed">${q.question}</div>

                    <!-- Hint Box -->
                    <div id="hint-${q.id}" class="hidden mb-4 p-4 rounded-xl bg-amber-950/30 border border-amber-500/30 text-amber-200 text-sm leading-relaxed fade-in">
                        ${q.hint}
                    </div>

                    <!-- Options -->
                    <div class="space-y-2.5 mb-4">
                        ${optionsHTML}
                    </div>

                    <!-- Key & Explanation Box (Shown after answered) -->
                    <div id="key-${q.id}" class="${isAnswered ? '' : 'hidden'} mt-4 p-4 rounded-xl bg-indigo-950/40 border border-indigo-500/30 text-indigo-200 text-sm leading-relaxed fade-in">
                        ${q.key}
                    </div>
                `;

                container.appendChild(card);
            });

            // Re-render MathJax equation formatting
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        // Handle user option selection
        function selectOption(questionId, selectedIndex) {
            userAnswers[questionId] = selectedIndex;
            
            // Check if user answer is correct
            const q = questionsData.find(item => item.id === questionId);
            if (selectedIndex === q.answer) {
                const card = document.getElementById(`q-card-${questionId}`);
                card.classList.add('correct-anim');
            }

            updateScore();
            renderQuestions(currentTab);
        }

        // Toggle Hint or Key visibility
        function toggleElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.toggle('hidden');
            }
        }

        // Tab Switching Logic
        function switchTab(tabNum) {
            currentTab = tabNum;
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                if (idx + 1 === tabNum) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            renderQuestions(tabNum);
        }

        // Calculate and update score
        function updateScore() {
            let score = 0;
            questionsData.forEach(q => {
                if (userAnswers[q.id] === q.answer) {
                    score++;
                }
            });
            document.getElementById('total-score').innerText = `${score} / 20`;
        }

        // Initial Load
        document.addEventListener("DOMContentLoaded", () => {
            renderQuestions(1);
        });
    </script>
</body>
</html>
